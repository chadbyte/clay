name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize every release run (beta, promote, stable) so a main-push beta
# release and a dispatched stable promotion can never mutate main/release
# concurrently. cancel-in-progress stays false: a running release must finish.
# Caveat: GitHub keeps only the newest *pending* run per group, so if a beta
# push lands while a stable run is still queued, the queued stable run is
# cancelled - re-run the promote dispatch in that case.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  beta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync release tags into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify origin/release >/dev/null 2>&1; then
            RELEASE_AHEAD=$(git rev-list --count HEAD..origin/release)
            if [ "$RELEASE_AHEAD" -gt 0 ]; then
              echo "Release branch is $RELEASE_AHEAD commits ahead of main, merging..."
              node scripts/release-sync.js release-to-main origin/release
              git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git main
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release (beta)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge main to release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git show main:scripts/release-sync.js > "$RUNNER_TEMP/release-sync.js"
          git checkout release
          node "$RUNNER_TEMP/release-sync.js" promote main
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger stable release
        run: gh workflow run release.yml --ref release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stable:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release (stable)
        run: npx semantic-release --branches release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Refresh origin/main immediately before merging and retry on a lost
      # race: the checkout at job start goes stale while semantic-release
      # runs, and direct pushes to main (PR merges) can land at any moment
      # even with the workflow-level concurrency group.
      - name: Merge release back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            node scripts/release-sync.js release-to-main release
            if git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git main; then
              exit 0
            fi
            echo "Push to main rejected (branch advanced during merge), retrying ($attempt/3)..."
            sleep 10
          done
          echo "Failed to merge release back to main after 3 attempts" >&2
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
