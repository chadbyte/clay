name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run privileged Linux skill bridge integration
        run: |
          if ! command -v getfacl >/dev/null || ! command -v setfacl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y acl
          fi
          sudo env "PATH=$PATH" "$(command -v node)" --test test/yoke-skill-bridge-manifest-mode.test.js

      - name: Install Chromium for browser integration tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run pane performance after correctness tests
        run: npm run test:pane-performance

      - name: Run privileged Linux worktree identity integration
        run: sudo env "PATH=$PATH" "$(command -v node)" test/fixtures/worktree-linux-identity.js
