name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Setup Python for avatar pixel regressions
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install avatar build dependency
        run: python -m pip install Pillow==12.1.1

      - name: Install Chromium for browser integration tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run privileged Linux worktree identity integration
        run: sudo env "PATH=$PATH" "$(command -v node)" test/fixtures/worktree-linux-identity.js
