<!doctype html>
<meta charset="utf-8">
<title>Sticky checklist production fixture</title>
<link rel="stylesheet" href="/lib/public/css/base.css">
<link rel="stylesheet" href="/lib/public/css/sticky-notes.css">
<script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; background: var(--bg); color: var(--text); }
  .sticky-note { max-width: calc(100vw - 24px); }
  #fixture-controls { position: fixed; z-index: 2000; top: 8px; left: 8px; padding: 8px; background: white; border: 1px solid #ccd1dc; }
  #sticky-notes-container { position: relative; width: 100vw; height: 100vh; }
</style>
<div id="fixture-controls"><button id="fixture-fail-save" type="button">Fixture: fail next save</button><button id="fixture-theme" type="button">Toggle theme</button><button id="fixture-disconnect" type="button">Disconnect</button></div>
<div class="sticky-notes-count hidden"></div>
<div id="sticky-notes-sidebar-count" class="hidden"></div>
<div id="sticky-notes-container"></div>
<script type="module">
  import { createStore, store } from "/lib/public/modules/store.js";
  import { setWs } from "/lib/public/modules/ws-ref.js";
  import { handleNotesList, handleNoteUpdated, handleNoteUpdateResult, initStickyNotes } from "/lib/public/modules/sticky-notes.js";
  createStore({ connected: false, stickyNoteUiState: {}, notesTemporarilyHidden: false });
  initStickyNotes();
  var params = new URLSearchParams(location.search);
  document.documentElement.classList.toggle("light-theme", params.get("theme") !== "dark");
  document.getElementById("fixture-theme").addEventListener("click", function () { document.documentElement.classList.toggle("light-theme"); });
  var socket = new WebSocket("ws://" + location.host);
  setWs(socket);
  socket.addEventListener("open", function () { store.set({ connected: true }); });
  socket.addEventListener("close", function () { store.set({ connected: false }); });
  socket.addEventListener("message", function (event) {
    var msg = JSON.parse(event.data);
    if (msg.type === "notes_list") handleNotesList(msg);
    if (msg.type === "note_updated") handleNoteUpdated(msg);
    if (msg.type === "note_update_result") handleNoteUpdateResult(msg);
  });
  window.fixtureSocket = socket;
  document.getElementById("fixture-disconnect").addEventListener("click", function () { socket.close(); });
  document.getElementById("fixture-fail-save").addEventListener("click", function () { socket.send(JSON.stringify({ type: "fixture_fail_next" })); });
</script>
