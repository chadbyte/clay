<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Clay pending queue fixture</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--text); }
    .fixture-shell { min-width: 0; min-height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    .fixture-top { padding: 18px 24px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 650; }
    #messages { padding: 26px max(24px, calc((100vw - 760px) / 2)); overflow: auto; }
    .fixture-transcript { margin-bottom: 10px; padding: 10px 13px; border-radius: 12px; background: var(--bg-alt); font-size: 13px; }
    #input-area, #input-wrapper, #input-row { min-width: 0; box-sizing: border-box; }
    #input-area { position: static; padding-bottom: 22px; }
    #input-wrapper { width: 100%; max-width: 760px; margin: 0 auto; }
    #input-row { width: 100%; padding: 10px 12px; }
    #input { width: 100%; max-width: 100%; box-sizing: border-box; border: 0; outline: 0; resize: none; background: transparent; color: var(--text); font: inherit; }
    .fixture-controls { display: flex; gap: 7px; padding: 8px 12px 0; }
    .fixture-controls button { border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; background: var(--bg-alt); color: var(--text-secondary); font: inherit; font-size: 11px; cursor: pointer; }
    #fixture-log { margin-left: auto; color: var(--text-dimmer); font-size: 10px; align-self: center; }
    @media (max-width: 600px) { .fixture-top { padding: 14px 16px; } #messages { padding: 18px 14px; } #input-area { padding: 0 8px 12px; } .fixture-controls { overflow-x: auto; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <main class="fixture-shell">
    <header class="fixture-top">Clay · Pending queue</header>
    <section id="messages" aria-label="Transcript"><div class="fixture-transcript">Current agent turn is still running.</div></section>
    <div id="input-area">
      <div id="input-wrapper">
        <section id="pending-message-queue" class="hidden" aria-label="Pending message queue" aria-live="polite"></section>
        <div id="input-row"><textarea id="input" rows="2">Main composer draft stays here</textarea></div>
        <div class="fixture-controls">
          <button id="seed" type="button">Queue 3</button>
          <button id="schedule" type="button">Schedule future</button>
          <button id="advance" type="button">Advance due</button>
          <button id="stop" type="button">Stop</button>
          <button id="complete" type="button">Complete turn</button>
          <span id="fixture-log">Connected</span>
        </div>
      </div>
    </div>
  </main>
  <script type="module">
    import { createStore, store } from '/modules/store.js';
    import { setWs } from '/modules/ws-ref.js';
    import { initPendingMessageQueue, handlePendingMessageQueueMessage } from '/modules/pending-message-queue.js';
    createStore({ connected: false, currentSlug: 'fixture-project', activeSessionId: 41, activeSessionMode: 'gui', dmMode: false, mateProjectSlug: null, myUserId: 'fixture-user', isMultiUserMode: true, pendingMessageQueue: { projectSlug: null, sessionId: null, revision: 0, paused: false, items: [], loading: false, error: '' }, pendingMessageQueueRequests: {}, pendingMessageQueueEdit: null, pendingMessageQueueDrag: null, pendingMessageQueueFocusReturn: null });
    window.fixtureStore = store;
    window.fixtureErrors = [];
    window.fixtureRuntime = [];
    window.fixtureHandleQueue = handlePendingMessageQueueMessage;
    initPendingMessageQueue();
    var ws = new WebSocket('ws://' + location.host);
    setWs(ws);
    ws.onopen = function () { store.set({ connected: true }); };
    ws.onmessage = function (event) {
      var msg = JSON.parse(event.data);
      if (handlePendingMessageQueueMessage(msg)) return;
      if (msg.type === 'user_message') {
        if (msg.projectSlug !== store.get('currentSlug') || String(msg.sessionId) !== String(store.get('activeSessionId'))) return;
        if (msg.clientMessageId && document.querySelector('[data-client-message-id="' + msg.clientMessageId + '"]')) return;
        var row = document.createElement('div');
        row.className = 'fixture-transcript';
        row.dataset.clientMessageId = msg.clientMessageId || '';
        row.textContent = msg.text;
        document.getElementById('messages').appendChild(row);
      }
      if (msg.type === 'fixture_runtime_started') document.getElementById('fixture-log').textContent = 'Delivered ' + msg.index;
      if (msg.type === 'error') { window.fixtureErrors.push(msg.text); document.getElementById('fixture-log').textContent = 'Error'; }
      if (msg.type === 'fixture_runtime_started') window.fixtureRuntime.push(msg);
    };
    document.getElementById('seed').onclick = function () { ws.send(JSON.stringify({ type: 'fixture_seed' })); };
    document.getElementById('schedule').onclick = function () { ws.send(JSON.stringify({ type: 'fixture_schedule' })); };
    document.getElementById('advance').onclick = function () { ws.send(JSON.stringify({ type: 'fixture_advance' })); };
    document.getElementById('stop').onclick = function () { ws.send(JSON.stringify({ type: 'fixture_stop' })); };
    document.getElementById('complete').onclick = function () { ws.send(JSON.stringify({ type: 'fixture_complete' })); };
  </script>
</body>
</html>
