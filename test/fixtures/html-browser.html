<!doctype html>
<html><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/lib/public/css/base.css">
  <link rel="stylesheet" href="/lib/public/css/messages.css">
  <link rel="stylesheet" href="/lib/public/css/filebrowser.css">
  <link rel="stylesheet" href="/lib/public/css/wireframe.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>window.fixtureErrors = []; window.addEventListener("error", function (event) { window.fixtureErrors.push(String(event.error || event.message)); }); window.addEventListener("unhandledrejection", function (event) { window.fixtureErrors.push(String(event.reason)); });</script>
</head><body>
  <style>.hidden {display:none!important} #file-tree {display:none} .fixture-toolbar {display:flex;flex-wrap:wrap;gap:4px} body {padding:24px;font:14px sans-serif} #main-panels {height:70vh;display:flex} #file-viewer {position:relative;flex:1;max-width:100%;width:100%;height:100%} #file-viewer-body {flex:1;overflow:auto;min-height:0} button {padding:7px;margin:3px} #fixture-result {white-space:pre-wrap}</style><h1>HTML file preview</h1><p>Real file viewer; simulated HTML file responses.</p><nav id="plantuml-controls"></nav><div id="main-panels"><div id="file-tree"></div>

    <section id="file-viewer" class="hidden">
      <div id="file-viewer-tabs"></div><div id="file-viewer-path"></div>
      <div class="fixture-toolbar">
      <button id="file-viewer-close">Close</button><button id="file-viewer-fullscreen">Fullscreen</button>
      <button id="file-viewer-slide-level"></button><button id="file-viewer-download">Download</button>
      <button id="file-viewer-refresh">Refresh</button>
      <button id="file-viewer-render" class="hidden">Source / Preview</button><button id="file-viewer-copy">Copy source</button>
      <button id="file-viewer-pdf" class="hidden"></button><button id="file-viewer-copy-formatted" class="hidden"></button>
      <button id="file-viewer-slides" class="hidden"></button><button id="file-viewer-history" class="hidden"></button>
      </div>
      <div id="file-viewer-body"></div>
    </section>
  </div>
  <input id="input" value="draft must survive file navigation">
  <main id="messages" hidden><div id="rendered" class="md-content"></div></main>
  <div id="fixture-result" role="status"></div>
  <script type="module" src="/test/fixtures/html-browser.js"></script>
</body></html>
